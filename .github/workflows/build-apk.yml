name: Build release APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # По умолчанию action ставит пакет 'tools', которого в SDK больше нет (sdkmanager падает).
          # Пустой список: на ubuntu-latest SDK уже есть, нужное докачает Gradle.
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            # Секретов нет: генерируем временный ключ, чтобы APK был подписан и ставился на телефон.
            # Android не устанавливает неподписанные APK (ошибка "пакет недействителен").
            echo "::warning::KEYSTORE_BASE64 не задан, подписываю временным ключом (обновление поверх APK с другим ключом потребует удаления старой версии)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 \
              -storepass android -keypass android -alias key0 \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BlurNavTest"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=key0" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi
      - name: Build release APK (R8)
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Verify APK is signed
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "APK: $APK"
          case "$APK" in *unsigned*) echo "::error::APK неподписан"; exit 1;; esac
          "$ANDROID_HOME"/build-tools/*/apksigner verify --verbose "$APK" | head -n 5
      - uses: actions/upload-artifact@v4
        with:
          name: blurnav-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error
